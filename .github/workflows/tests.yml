name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    # Darkstractor es una herramienta de Windows: las rutas reservadas y el
    # saneado de nombres solo se prueban de verdad sobre NTFS.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Comprobar que no hacen falta dependencias externas
        run: python -c "import darkstractor, darkstractor.cli, darkstractor.gui"

      - name: Tests
        run: python -m unittest discover -s tests -v
